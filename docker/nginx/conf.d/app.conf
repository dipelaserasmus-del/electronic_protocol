server {
    listen 80;
    index index.php;

    root /var/www/html/public;

    # Look up the "app" container through Docker's DNS on every request (cached 5 s) instead of once at
    # start-up: when Docker recreates the app container it gets a new address, and a fixed
    # "fastcgi_pass app:9000" would keep answering 502 until nginx is restarted (F06).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        # gzip_static on;
    }

    location ~ \.php$ {
        # try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }    
}
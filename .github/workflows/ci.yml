name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, MySQL 8.4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: laravel
          MYSQL_PASSWORD: astrongpass
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, gd, intl, bcmath, bz2, pdo_mysql, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run test suite
        run: vendor/bin/phpunit --log-junit junit-${{ matrix.php }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php${{ matrix.php }}
          path: junit-${{ matrix.php }}.xml

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: composer audit
        run: composer audit --locked --no-interaction
      - name: npm audit (report only until frontend modernization, task N03)
        run: npm audit --package-lock-only --audit-level=high || echo "::warning::npm audit reported issues (expected until N03)"

  plan:
    name: Progress tracker & data hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PROGRESS.md matches tasks.toml
        run: python3 docs/plan/tools/pert.py --check
      - name: No user data committed (stored files, local-data/, real .env files)
        run: |
          bad=$(git ls-files storage/app local-data .env.development .env.real \
                | grep -vE '(^|/)(dummy|\.gitignore|protocol\.sqlite(\.example)?)$' || true)
          if [ -n "$bad" ]; then echo "::error::user data must not be committed:"; echo "$bad"; exit 1; fi
          echo "OK: no stored files or local data tracked"

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t electronic-protocol-app .
      - name: Smoke test image
        run: docker run --rm electronic-protocol-app sh -c 'php -v && php -m | grep -E "pdo_mysql|gd|zip|intl|mbstring" && php-fpm -t'

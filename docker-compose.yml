# Production-like stack: PHP-FPM app, nginx, MySQL 8.4 LTS.
# Development extras (mock mail servers) are in docker-compose.dev.yml.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: electronic-protocol-app
    container_name: app
    restart: unless-stopped
    volumes:
      # :z = SELinux label (Fedora/RHEL); ignored on systems without SELinux
      - ./:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.4
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-astrongpass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-myStrongRootP@ss}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/app.cnf:ro,z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - app-network

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports:
      - ${APP_PORT:-80}:80
    volumes:
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/:ro,z
      - ./:/var/www/html:ro,z
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:

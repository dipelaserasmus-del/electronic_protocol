# Development / test extras. Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# or simply: ./dev.sh up
services:
  app:
    environment:
      # Laravel then reads .env.development (created by ./dev.sh from .env.development.example)
      # and never touches your normal .env
      APP_ENV: development

  db:
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - ${DB_FORWARD_PORT:-33060}:3306

  # Mock IMAP + SMTP server. Mailboxes are preloaded from docker/dev/mail-preload
  # (generated by `./dev.sh mail`), so no real mailbox is ever touched.
  imap:
    image: greenmail/standalone:2.1.3
    container_name: imap
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap -Dgreenmail.setup.test.smtp
        -Dgreenmail.users=protocol:secret@school.test
        -Dgreenmail.users.login=email
        -Dgreenmail.preload.dir=/preload
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false
        -Dgreenmail.verbose
    volumes:
      - ./docker/dev/mail-preload:/preload:ro
    ports:
      - ${IMAP_FORWARD_PORT:-3143}:3143
    networks:
      - app-network

  # Catches all outgoing mail (receipts, assignment notifications, password resets). Web UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - ${MAILPIT_UI_PORT:-8025}:8025
    networks:
      - app-network

# Development / test stack. Always start it with ./dev.sh, which uses its own Compose project
# ("electronic-protocol-dev"): separate containers, network and DATABASE VOLUME, so it can never
# touch a normal installation running from the same folder.
services:
  app:
    container_name: ep-dev-app
    environment:
      # Laravel then reads .env.development (created by ./dev.sh from .env.development.example)
      # and never touches your normal .env
      APP_ENV: development
      # separate cache files: a "php artisan config:cache" of a normal installation is never used here
      APP_CONFIG_CACHE: /tmp/ep-dev-config.php
      APP_ROUTES_CACHE: /tmp/ep-dev-routes.php
      APP_SERVICES_CACHE: /tmp/ep-dev-services.php
      APP_PACKAGES_CACHE: /tmp/ep-dev-packages.php
      APP_EVENTS_CACHE: /tmp/ep-dev-events.php

  nginx:
    container_name: ep-dev-nginx

  db:
    container_name: ep-dev-db
    volumes:
      - devdbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - ${DB_FORWARD_PORT:-33060}:3306

  # Mock IMAP + SMTP server. Mailboxes are preloaded from docker/dev/mail-preload
  # (generated by `./dev.sh mail`), so no real mailbox is ever touched.
  imap:
    image: greenmail/standalone:2.1.3
    container_name: ep-dev-imap
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap -Dgreenmail.setup.test.smtp
        -Dgreenmail.users=protocol:secret@school.test
        -Dgreenmail.users.login=email
        -Dgreenmail.preload.dir=/preload
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false
        -Dgreenmail.verbose
    volumes:
      - ./docker/dev/mail-preload:/preload:ro,z
    ports:
      - ${IMAP_FORWARD_PORT:-3143}:3143
    networks:
      - app-network

  # Catches all outgoing mail (receipts, assignment notifications, password resets). Web UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ep-dev-mailpit
    ports:
      - ${MAILPIT_UI_PORT:-8025}:8025
    networks:
      - app-network

volumes:
  devdbdata:
